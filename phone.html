<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: use the whole screen, including around a notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Domain Expansion</title>
    <!-- makes it installable as an app ("Add to Home screen") -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icon.svg" />
  </head>
  <!-- class="play": PHONE MODE. Same game code as the laptop version, but only the camera,
       the edge-darkening vignette (= cast progress) and the domain effects are visible. -->
  <body class="play">
    <div id="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="fx"></canvas>
      <canvas id="fxgl"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <div id="vignette"></div>

    <!-- shown until the first tap (a tap is required to go fullscreen + keep the screen awake) -->
    <div id="tapHint">Tap to begin <small id="version"></small></div>

    <!-- the game code expects these elements; in play mode they're hidden by CSS -->
    <div id="hud"><span id="status"></span><span id="fps"></span></div>
    <div id="cast"><div id="castLabel"></div><div id="castMeta"></div><div id="holdBar"><div id="holdFill"></div></div></div>
    <div id="expansion"><small>DOMAIN EXPANSION</small><span id="expansionName"></span></div>
    <div id="panel">
      <h3></h3><select id="domainSelect"></select><button id="recordBtn"></button>
      <div id="recordInfo"></div><ul id="counts"></ul><button id="clearBtn"></button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
